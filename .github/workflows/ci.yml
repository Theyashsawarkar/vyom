name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # vyom.live's tests import it, and it needs PyGObject (the system
      # Python's, from apt).
      - name: PyGObject and GTK 4
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-gtk4layershell-1.0
      - name: Compile
        run: python3 -m py_compile vyom/*.py bin/vyom
      - name: Tests
        run: python3 -m unittest discover tests
      - name: Version and changelog agree
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' vyom/__init__.py)
          grep -q "^## v$v " CHANGELOG.md || { echo "CHANGELOG.md has no entry for v$v"; exit 1; }
      - name: Website is up to date
        run: python3 scripts/build-site.py --check
