name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile vyom/*.py bin/vyom
      - name: Version and changelog agree
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' vyom/__init__.py)
          grep -q "^## v$v " CHANGELOG.md || { echo "CHANGELOG.md has no entry for v$v"; exit 1; }
      - name: Website is up to date
        run: python3 scripts/build-site.py --check
