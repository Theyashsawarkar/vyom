# ~/.config/vyom/config.toml -- every key is optional. Reload: vyom reload

[vyom]
# Installed tools not to load:
# disabled = ["raga"]
# Every panel opens at this one size, so switching tools never jumps
# (kendra, anchored under the bar, keeps its own); times scale, capped
# at 90% of the screen:
# width = 900
# height = 520
# scale = 1.25
# Panel background opacity: 1 is solid, lower lets more of the blurred
# desktop show through (0.3 to 1):
# opacity = 0.72
# css = ["~/.local/state/varna/vyom.css"]   # more stylesheets, loaded last
# A hidden panel keeps its surface (its buffers in graphics memory, ~10
# MB a panel), so reopening it is instant. Only a rarely used one lets go,
# after release_after seconds hidden (reopening it then takes 10-25 ms
# more); false keeps every surface. Never released: the launcher (the
# warm-up's panel), the panels in keep, any tool with `keep = true` in its
# [plugin.<name>], and any opened keep_often times in the last week:
# release_after = 600
# keep = ["dvara", "ganit", "smriti", "bhava", "kendra"]
# keep_often = 5
# Publish the live system state (ADR 12) for other programs, on D-Bus and
# in $XDG_RUNTIME_DIR/vayu/state (panels use it either way); false: don't:
# live = true
# Panels belong to the workspace they open on (sway; ADR 17): leaving it
# hides them as they are, coming back shows them again. false: one set of
# panels for every workspace:
# follow_workspaces = true

# Each tool's own settings live under [plugin.<name>]; its README lists
# them. Any tool also takes `slot` (where it sits among open panels:
# "center", "top-right"...; panels in different slots open side by side,
# one in a taken slot covers the panel there), `transient = true` (close
# when it loses the keyboard, like vyom dmenu) and `keep`. A few examples:

[plugin.dvara]
# terminal = "kitty"

[plugin.tarang]
# hotspot_command = "vayu-hotspot"

[plugin.urja]
# limit_file = "~/.local/state/battery-limit/threshold"

[plugin.kendra]
# tiles = ["wifi", "bluetooth", "hotspot", "dnd", "caffeine", "theme", "wallpaper", "power-profile"]
# lock = "swaylock"
# power = "vyom vishram"
